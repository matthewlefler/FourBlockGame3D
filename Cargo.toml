# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[package]
name = "FourBlockGame3D"
version = "0.1.0"
authors = ["Skye <matthewlefler1@gmail.com>"]
edition = "2024"

[dependencies]
bevy = { version = "0.18.1", features = ["serialize"] }
rand = "0.10.1"
serde = "1.0.228"
serde_json = "1.0.149"
